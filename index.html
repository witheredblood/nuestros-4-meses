<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#2b0813">
<title>Para mi niña bonita</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.cdnfonts.com/css/minecraft-3" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400..700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css?v=6">
</head>
<body>
<div id="petals" aria-hidden="true"></div>

<div id="mc-toast" class="mc-toast" role="status" aria-live="polite" hidden>
  <svg class="mc-toast-icon" viewBox="0 0 9 9" aria-hidden="true" shape-rendering="crispEdges">
    <path fill="#000" d="M1,0h2v1h-2zM6,0h2v1h-2zM0,1h1v4h-1zM3,1h1v1h-1zM5,1h1v1h-1zM4,2h1v1h-1zM8,1h1v4h-1zM1,5h1v1h-1zM7,5h1v1h-1zM2,6h1v1h-1zM6,6h1v1h-1zM3,7h1v1h-1zM5,7h1v1h-1zM4,8h1v1h-1z"/>
    <path fill="#ff1717" d="M1,1h2v4h-2zM6,1h2v4h-2zM3,2h1v5h-1zM5,2h1v5h-1zM4,3h1v5h-1zM2,5h1v1h-1zM6,5h1v1h-1z"/>
    <path fill="#bd1212" d="M7,2h1v3h-1zM6,5h1v1h-1zM5,6h1v1h-1zM4,7h1v1h-1z"/>
    <rect fill="#fff" x="1" y="2" width="1" height="1"/>
  </svg>
  <div class="mc-toast-txt">
    <span class="mc-toast-head">¡Logro conseguido!</span>
    <span class="mc-toast-sub">4 meses juntos</span>
  </div>
</div>

<section id="welcome" class="screen">
  <h1 data-t="welcomeTitle"></h1>
  <p data-t="welcomeText"></p>
  <button id="open" class="btn" data-t="openBtn"></button>
</section>

<section id="mc-load" class="screen" hidden aria-live="polite">
  <p id="mc-title" class="mc-title">Generando terreno...</p>
  <canvas id="mc-chunks" width="110" height="110" aria-hidden="true"></canvas>
  <p id="mc-pct" class="mc-pct">0%</p>
  <div class="mc-bar" aria-hidden="true"><div id="mc-fill"></div></div>
</section>

<main id="app" tabindex="-1" hidden>
  <section id="aniversario" class="sec">
    <p class="kicker" data-t="annivKicker"></p>
    <div class="four" aria-label="Cuatro">4</div>
    <p class="meses">meses</p>
    <p class="big" data-t="annivPhrase"></p>
    <div id="count" role="timer" aria-label="Tiempo juntos"></div>
    <p class="note" data-t="annivNote"></p>
  </section>

  <section id="recuerdos" class="sec">
    <h2 data-t="memTitle"></h2>
    <p class="sub" data-t="memHint"></p>
    <div class="grid" id="grid"></div>
  </section>

  <section id="carta" class="sec">
    <h2 data-t="letterTitle"></h2>
    <p class="sub" data-t="letterHint"></p>
    <button id="env" class="env" aria-label="Abrir el sobre"><span class="flap"></span><span class="seal">♥</span></button>
    <article id="paper" class="paper" aria-live="polite"></article>
  </section>

  <section id="sorpresas" class="sec">
    <h2 data-t="surpTitle"></h2>
    <p class="sub" data-t="surpHint"></p>
    <p class="box" id="reason" aria-live="polite"></p>
    <button id="rbtn" class="btn" data-t="reasonBtn"></button>
    <p class="sub msgtitle" data-t="msgHint"></p>
    <div class="msgs" id="msgs"></div>
    <button id="heart" class="heart" aria-label="Corazón: tócalo">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg>
    </button>
    <p class="box hmsg" id="hmsg" aria-live="polite"></p>
  </section>

  <section id="final" class="sec" hidden>
    <div class="hrt" aria-hidden="true">♥</div>
    <h2 data-t="finalTitle"></h2>
    <p class="big" data-t="finalText"></p>
    <p class="sign" data-t="finalSign"></p>
  </section>

  <div id="prog" role="status"></div>
</main>

<dialog id="dlg" aria-label="Recuerdo">
  <div class="card">
    <div id="dph"></div>
    <p id="dcap"></p>
    <button id="dx" class="btn">Cerrar</button>
  </div>
</dialog>

<script src="config.js?v=5"></script>
<script src="script.js?v=5"></script>
<script src="enderman.js?v=5"></script>
</body>
</html>
